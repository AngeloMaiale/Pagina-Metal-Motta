# Configuración de despliegue en Netlify.
#
# La versión de Node se fija a propósito: el proyecto exige Node >= 22.12
# (ver "engines" en package.json) y Netlify cambia su versión por defecto cada
# cierto tiempo. Sin fijarla, un día el sitio dejaría de compilar sin que nadie
# hubiera tocado el código.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# Los archivos con huella en el nombre (los que genera Astro en /_astro) nunca
# cambian de contenido: se pueden guardar en caché indefinidamente. Importa en
# conexiones lentas, que es el caso de buena parte del público en Maracaibo.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML sí cambia con cada publicación: se revalida siempre.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cabeceras de seguridad básicas para todo el sitio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# El panel de administración no debe indexarse ni incrustarse en otra página.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
